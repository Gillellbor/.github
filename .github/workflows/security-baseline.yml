name: Reusable Security Baseline

# Reusable security scanning workflow.
# Runs: CodeQL + Trivy filesystem scan + npm audit (if package.json) + secret scan check.
#
# Consumer pattern (in <project>/.github/workflows/security.yml):
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     schedule:
#       - cron: "0 5 * * 1"  # Weekly Monday 5am UTC
#   jobs:
#     security:
#       uses: Gillellbor/.github/.github/workflows/security-baseline.yml@main
#       with:
#         language: javascript-typescript  # or python, go, etc.

on:
  workflow_call:
    inputs:
      language:
        description: "CodeQL language (javascript-typescript | python | go | java)"
        type: string
        default: "javascript-typescript"
      trivy-scan:
        description: "Run Trivy filesystem scan"
        type: boolean
        default: true
      npm-audit:
        description: "Run npm audit (if package.json present)"
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG_INPUT: ${{ inputs.language }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.2
        with:
          languages: ${{ inputs.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.2
        with:
          category: "/language:${{ inputs.language }}"

  trivy:
    name: Trivy filesystem scan
    if: inputs.trivy-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a11da62073708815958ea6d84f5650c78a3ef85b # 0.24.0
        with:
          scan-type: "fs"
          scan-ref: "."
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

  npm-audit:
    name: npm audit
    if: inputs.npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for package.json
        id: check
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run npm audit (high+ severity)
        if: steps.check.outputs.exists == 'true'
        run: npm audit --audit-level=high
