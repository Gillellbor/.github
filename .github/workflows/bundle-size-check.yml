name: Reusable Bundle Size Check

# Bundle size regression check via BundleMon.
# Runs on PR, comments delta vs main branch baseline.
#
# Consumer pattern (in <project>/.github/workflows/ci.yml):
#   jobs:
#     bundle:
#       uses: Gillellbor/.github/.github/workflows/bundle-size-check.yml@main
#       with:
#         build-command: "npm run build"
#         output-dir: ".next/static"
#
# Requires <project>/.bundlemonrc.json with budget config.

on:
  workflow_call:
    inputs:
      build-command:
        description: "Build command to produce bundle"
        type: string
        default: "npm run build"
      output-dir:
        description: "Directory to scan for bundle size"
        type: string
        default: ".next/static"
      package-manager:
        description: "npm | pnpm | yarn"
        type: string
        default: "npm"
      node-version:
        type: string
        default: "22"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  bundle:
    name: Bundle size check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PM: ${{ inputs.package-manager }}
      BUILD_CMD: ${{ inputs.build-command }}
      OUTPUT_DIR: ${{ inputs.output-dir }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: |
          if [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Build
        run: ${{ inputs.build-command }}

      - name: BundleMon
        uses: lironer/bundlemon-action@b18bccba37b8d2e7c9d1b41e7b9b8e3eb9f6d2e3 # v1.1.0
        env:
          CI_REPO_OWNER: ${{ github.repository_owner }}
          CI_REPO_NAME: ${{ github.event.repository.name }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
