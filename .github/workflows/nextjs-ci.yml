name: Reusable Next.js CI

# Reusable CI workflow for Next.js + TypeScript projects.
# Call from consuming repo's `.github/workflows/ci.yml`:
#
#   on:
#     pull_request:
#     push:
#       branches: [dev, main]
#   jobs:
#     ci:
#       uses: Gillellbor/.github/.github/workflows/nextjs-ci.yml@main
#       with:
#         node-version: "22"
#         package-manager: "npm"

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      package-manager:
        description: "npm | pnpm | yarn"
        type: string
        default: "npm"
      build:
        description: "Run next build smoke test"
        type: boolean
        default: true
      type-check:
        description: "Run tsc --noEmit"
        type: boolean
        default: true
      lint:
        description: "Run next lint / eslint / biome"
        type: boolean
        default: true
      test:
        description: "Run unit tests"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PM: ${{ inputs.package-manager }}
      NODE_VERSION: ${{ inputs.node-version }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Harden runner (egress monitoring)
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm (if applicable)
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: |
          if [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: TypeScript type-check
        if: inputs.type-check
        run: |
          "$PM" exec tsc --noEmit

      - name: Lint
        if: inputs.lint
        run: |
          if [ -f "biome.json" ] || [ -f "biome.jsonc" ]; then
            "$PM" exec biome check .
          else
            "$PM" run lint
          fi

      - name: Test
        if: inputs.test
        run: |
          "$PM" test --run --passWithNoTests

      - name: Build (smoke test)
        if: inputs.build
        run: |
          "$PM" run build
